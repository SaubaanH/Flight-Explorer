<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<!-- Relative paths so the same file works from Android assets and the iOS bundle. -->
<link href="maplibre/maplibre-gl.css" rel="stylesheet"/>
<script src="maplibre/maplibre-gl.js"></script>
<style>
  html, body, #map { margin:0; padding:0; height:100%; width:100%; background:#F0EEEA; }
  /* Hide map chrome until the route camera is fitted — avoids world-flash then jump. */
  #map .maplibregl-canvas-container,
  #map .maplibregl-control-container { opacity: 0; transition: none; }
  #map.is-ready .maplibregl-canvas-container,
  #map.is-ready .maplibregl-control-container { opacity: 1; }
  #status {
    position:absolute; z-index:2; left:12px; right:12px; top:12px;
    font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, sans-serif;
    color:#C9184A; background:#FFE6EE; border-radius:14px; padding:10px 12px;
    display:none;
  }
  .marker {
    background:#E83A6F; color:white; border-radius:999px; padding:6px 10px;
    font: 600 11px/1.2 -apple-system, BlinkMacSystemFont, sans-serif;
    box-shadow:0 2px 8px rgba(0,0,0,.25); white-space:nowrap;
    border:1px solid rgba(255,255,255,.35);
  }
  .endpoint {
    width:12px; height:12px; border-radius:50%;
    background:#E83A6F; border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="status"></div>
<div id="map"></div>
<script>
  const statusEl = document.getElementById('status');
  function showStatus(msg) {
    statusEl.style.display = 'block';
    statusEl.textContent = msg;
  }

  // Key-free styles (no Carto API key). Try OpenFreeMap → MapLibre demotiles → Esri raster.
  const STYLES = [
    'https://tiles.openfreemap.org/styles/liberty',
    'https://demotiles.maplibre.org/style.json',
    {
      version: 8,
      sources: {
        esri: {
          type: 'raster',
          tiles: ['https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          attribution: '© Esri'
        }
      },
      layers: [{ id: 'esri', type: 'raster', source: 'esri' }]
    }
  ];

  let map;
  // Expose for native hosts that re-parent the WebView and need map.resize().
  window.map = null;
  let markerObjs = [];
  let endpointObjs = [];
  let routeSourceReady = false;
  let pending = null;
  let styleIndex = 0;
  let lastMarkerKey = null;
  let navControl = null;

  function onMapReady() {
    statusEl.style.display = 'none';
    if (pending) {
      applyUpdate(pending.markers, pending.route);
      pending = null;
    }
  }

  function setMapRevealed(revealed) {
    const el = document.getElementById('map');
    if (!el) return;
    if (revealed) el.classList.add('is-ready');
    else el.classList.remove('is-ready');
  }

  function createMap(style) {
    setMapRevealed(false);
    map = new maplibregl.Map({
      container: 'map',
      style: style,
      center: [0, 20],
      zoom: 1.2,
      attributionControl: false,
      renderWorldCopies: true,
      fadeDuration: 0
    });
    map.on('error', (e) => {
      const msg = (e && e.error && e.error.message) ? e.error.message : 'Map tile error';
      console.log('map error', msg);
      if (styleIndex < STYLES.length - 1) {
        styleIndex += 1;
        try { map.remove(); } catch (_) {}
        routeSourceReady = false;
        lastMarkerKey = null;
        navControl = null;
        createMap(STYLES[styleIndex]);
      } else {
        showStatus(msg);
        setMapRevealed(true);
      }
    });
    window.map = map;
    map.on('load', onMapReady);
  }

  try {
    if (typeof maplibregl === 'undefined') {
      showStatus('Map library failed to load.');
    } else {
      createMap(STYLES[0]);
    }
  } catch (err) {
    showStatus('Map init error: ' + err);
  }

  function ensureRouteLayer() {
    if (!map || routeSourceReady) return;
    map.addSource('route', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      paint: { 'line-color': '#E83A6F', 'line-width': 3 }
    });
    routeSourceReady = true;
  }

  function clearEndpoints() {
    endpointObjs.forEach(m => m.remove());
    endpointObjs = [];
  }

  function shortPathDest(route) {
    let delta = route.dLng - route.oLng;
    while (delta > 180) delta -= 360;
    while (delta < -180) delta += 360;
    return { lng: route.oLng + delta, lat: route.dLat, delta: delta };
  }

  function markerKey(markers) {
    return (markers || []).map(m => m.code + ':' + m.count + ':' + m.minPoints).join('|');
  }

  function setNavVisible(show) {
    if (show && !navControl) {
      navControl = new maplibregl.NavigationControl({ showCompass: false });
      map.addControl(navControl, 'top-right');
    } else if (!show && navControl) {
      map.removeControl(navControl);
      navControl = null;
    }
  }

  function applyUpdate(markers, route) {
    if (!map) return;
    const nextKey = markerKey(markers);
    const markersChanged = nextKey !== lastMarkerKey;
    const bounds = new maplibregl.LngLatBounds();

    if (markersChanged) {
      lastMarkerKey = nextKey;
      markerObjs.forEach(m => m.remove());
      markerObjs = [];
      (markers || []).forEach(m => {
        const el = document.createElement('div');
        el.className = 'marker';
        el.textContent = m.code + ' · ' + m.count + ' · ' + Number(m.minPoints).toLocaleString() + 'pts';
        el.setAttribute('aria-label', m.city + ' ' + m.count + ' flights from ' + m.minPoints + ' points');
        el.onclick = () => {
          if (window.AndroidBridge && AndroidBridge.onMarkerClick) {
            AndroidBridge.onMarkerClick(m.code);
          } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.markerClick) {
            window.webkit.messageHandlers.markerClick.postMessage(m.code);
          }
        };
        const marker = new maplibregl.Marker({ element: el }).setLngLat([m.lng, m.lat]).addTo(map);
        markerObjs.push(marker);
        bounds.extend([m.lng, m.lat]);
      });
    } else {
      (markers || []).forEach(m => bounds.extend([m.lng, m.lat]));
    }

    const hasMarkers = (markers || []).length > 0;
    setNavVisible(hasMarkers);
    // Detail preview is non-interactive; discover map keeps gestures.
    if (map.dragPan) {
      if (hasMarkers) {
        map.dragPan.enable();
        map.scrollZoom.enable();
        map.doubleClickZoom.enable();
      } else {
        map.dragPan.disable();
        map.scrollZoom.disable();
        map.doubleClickZoom.disable();
      }
    }

    clearEndpoints();

    // Route-only sheet: keep canvas hidden until fitBounds finishes (no world-flash).
    // Discover (markers): always revealed.
    if (!hasMarkers && route) {
      setMapRevealed(false);
    } else {
      setMapRevealed(true);
    }

    if (map.isStyleLoaded()) {
      ensureRouteLayer();
      if (route) {
        // Straight short-path lon (NOT a polar great-circle — those frame on the Arctic).
        const short = shortPathDest(route);
        map.getSource('route').setData({
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: [[route.oLng, route.oLat], [short.lng, short.lat]]
          }
        });

        if (!hasMarkers) {
          const oEl = document.createElement('div');
          oEl.className = 'endpoint';
          const dEl = document.createElement('div');
          dEl.className = 'endpoint';
          endpointObjs.push(
            new maplibregl.Marker({ element: oEl }).setLngLat([route.oLng, route.oLat]).addTo(map),
            new maplibregl.Marker({ element: dEl }).setLngLat([short.lng, short.lat]).addTo(map)
          );

          const west = Math.min(route.oLng, short.lng);
          const east = Math.max(route.oLng, short.lng);
          const south = Math.min(route.oLat, short.lat);
          const north = Math.max(route.oLat, short.lat);
          const padLng = Math.max((east - west) * 0.12, 4);
          const padLat = Math.max((north - south) * 0.12, 3);
          const routeBounds = new maplibregl.LngLatBounds(
            [west - padLng, south - padLat],
            [east + padLng, north + padLat]
          );
          map.fitBounds(routeBounds, {
            padding: { top: 28, bottom: 28, left: 36, right: 36 },
            maxZoom: 4,
            duration: 0
          });
          map.once('idle', () => {
            setMapRevealed(true);
            notifyMapReady();
          });
        } else {
          bounds.extend([route.oLng, route.oLat]);
          bounds.extend([route.dLng, route.dLat]);
        }
      } else if (map.getSource('route')) {
        map.getSource('route').setData({ type: 'FeatureCollection', features: [] });
      }
    }

    if (hasMarkers && markersChanged && !bounds.isEmpty()) {
      map.fitBounds(bounds, { padding: 48, maxZoom: 5, duration: 500 });
    }
  }

  function notifyMapReady() {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mapReady) {
        window.webkit.messageHandlers.mapReady.postMessage('ready');
      }
    } catch (_) {}
  }

  window.updateFlightMap = function(markers, route) {
    if (!map || !map.isStyleLoaded()) {
      pending = { markers, route };
      return;
    }
    applyUpdate(markers, route);
  };
</script>
</body>
</html>
